<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الخاص - رومانسية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #800000, #b30000, #e60000, #ff3333);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box, .main-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 550px;
            padding: 30px;
            text-align: center;
        }
        .main-card { display: none; }
        .login-input { padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; width: 80%; margin-bottom: 15px; text-align: center; outline: none; }
        .login-btn { padding: 12px 30px; font-size: 16px; background: #ff4d4d; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .login-btn:hover { background: #e03b3b; }
        .header-title { font-size: 1.8rem; color: #800000; margin-bottom: 15px; font-weight: bold; }
        .date-text { font-size: 1.4rem; color: #ff1a1a; font-weight: 600; }
        .message-text { font-size: 1.1rem; color: #555; margin: 20px 0; line-height: 1.6; }
        
        /* إطار الصورة الدائري */
        .photo-container {
            width: 160px;
            height: 160px;
            margin: 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #ff4d4d;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
            background: #fff;
        }
        .main-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .video-item video { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; background: #000; outline: none; }
        
        .audio-container { margin-top: 20px; }
        audio { width: 100%; outline: none; }
        
        .birthday-link-btn { display: inline-block; margin-top: 25px; padding: 12px 25px; background: #ff4d4d; color: white; text-decoration: none; font-weight: bold; border-radius: 12px; transition: 0.3s; }
        .birthday-link-btn:hover { background: #e03b3b; }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h2>كل سنه وانتي معيايا</h2>
        <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور" onkeypress="handleEnter(event)">
        <br>
        <button class="login-btn" onclick="checkPassword()">دخول</button>
    </div>

    <div class="main-card" id="mainContent">
        <div class="header-title">♥ days left y rohy♥</div>
        <div class="date-text">♥ 18-9-2004 ♥</div>

        <p class="message-text"> ♥ اليوم ده اتولدت احلي واحده في الدنيا كله بحبك اوي ♥. </p>
         ♥.بحبك عشان ضحكتك بتنور حياتي♥️


        <!-- الصورة مع امتدادها الصحيح 1.jpeg -->
        <div class="photo-container">
            <img src="1.jpeg" alt="صورتنا" onerror="this.src='1.jpg'" class="main-photo">
        </div>
        .بحبك عشان عيونك بتسحرني♥♥️

        <!-- الفيديوهات -->
        <div class="video-grid">
            <div class="video-item">
                <video controls>
                    <source src="video1.mp4" type="video/mp4">
                    متصفحك لا يدعم عرض الفيديو
                </video>
            </div>
            <div class="video-item">
                <video controls>
                    <source src="video2.mp4" type="video/mp4">
                    متصفحك لا يدعم عرض الفيديو
                </video>
            </div>
        </div>

        <!-- الأغنية -->
        <div class="audio-container">
            <audio controls>
                <source src="song.mp3" type="audio/mp3">
                متصفحك لا يدعم تشغيل الصوت
            </audio>
        </div>

        <div>
            <a href="birthday.html" class="birthday-link-btn">🎉 صفحة عيد الميلاد 🎂</a>
        </div>
    </div>

    <script>
        function checkPassword() {
            var password = document.getElementById("passInput").value.trim();
            if (password === "Rody189") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        }
    </script>
</body>
</html>
